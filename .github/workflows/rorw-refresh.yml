# Every night: refresh this season from Sleeper, top up every daily game (scripts/nightly.py), build
# today's Rostered or Waiver from the live rosters, save it all, and republish the site. Runs just after midnight Eastern, so it resets with every other game: 05:05 UTC in
# winter, 04:05 UTC in summer. Both times are listed; the one that isn't after midnight Eastern finds that
# day's game already built and does nothing. It can also be
# started by hand from the repository's Actions tab ("Run workflow").
name: Nightly refresh (all games)

on:
  schedule:
    - cron: "5 5 * * *"
    - cron: "5 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh the data and build today's games
        run: python scripts/nightly.py
      - name: Save it to the repository
        run: |
          git config user.name "das-trivia-bot"
          git config user.email "das-trivia-bot@users.noreply.github.com"
          git add data site/data
          if ! git diff --cached --quiet; then
            git commit -m "Nightly refresh: Sleeper data, every game topped up, today's Rostered or Waiver"
            git push
          fi
      # A save made by this job doesn't start the normal publish job, so publish here.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
